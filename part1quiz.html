<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Female Reproductive Anatomy — Practice Quiz</title>
<style>
:root{
  --teal-900:#0a2e2e;
  --teal-800:#0f3d3d;
  --teal-700:#155454;
  --teal-600:#1c6b6b;
  --teal-500:#238484;
  --teal-100:#e3f1ef;
  --teal-50:#f2f8f7;
  --coral-500:#e0693f;
  --coral-600:#c9552e;
  --ink-900:#132524;
  --ink-700:#3a4d4c;
  --ink-500:#647877;
  --paper:#fbfaf7;
  --card:#ffffff;
  --line:#dde6e4;
  --good:#1c7d5a;
  --good-bg:#e5f5ee;
  --bad:#b4402a;
  --bad-bg:#fbeae6;
  --radius-lg:18px;
  --radius-md:12px;
  --radius-sm:8px;
  --shadow:0 1px 2px rgba(19,37,36,.06), 0 8px 24px -12px rgba(19,37,36,.18);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
[data-theme="dark"]{
  --paper:#0c1a19;
  --card:#122624;
  --line:#1f3735;
  --ink-900:#eef5f3;
  --ink-700:#c3d3d0;
  --ink-500:#8ba4a1;
  --teal-100:#173836;
  --teal-50:#102422;
  --good-bg:#123227;
  --bad-bg:#331d18;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{
  margin:0;
  font-family:var(--font);
  background:var(--paper);
  color:var(--ink-900);
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
  transition:background .25s ease,color .25s ease;
}
.app{
  max-width:900px;
  margin:0 auto;
  padding-left:max(14px,env(safe-area-inset-left));
  padding-right:max(14px,env(safe-area-inset-right));
}
button{font-family:inherit;cursor:pointer;min-height:44px}
h1,h2,h3,p{margin:0}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--coral-500);outline-offset:2px}

/* ---------- Top bar / theme toggle (global) ---------- */
.topbar{display:flex;justify-content:flex-end;padding:10px 0 0}
.theme-btn{
  display:flex;align-items:center;gap:6px;
  background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:8px 14px;font-size:14px;color:var(--ink-700);
  box-shadow:var(--shadow);
}

/* ---------- Start screen ---------- */
.start-screen{
  min-height:calc(100vh - 60px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:32px 8px 48px;gap:0;
}
.start-emblem{
  width:76px;height:76px;border-radius:22px;
  background:linear-gradient(155deg,var(--teal-600),var(--teal-800));
  display:flex;align-items:center;justify-content:center;
  font-size:34px;box-shadow:var(--shadow);margin-bottom:22px;
}
.start-title{
  font-size:clamp(26px,6vw,38px);font-weight:700;letter-spacing:-.01em;
  color:var(--ink-900);line-height:1.15;max-width:520px;
}
.start-sub{
  margin-top:10px;color:var(--ink-500);font-size:clamp(15px,3.6vw,17px);
}
.start-stats{
  display:flex;gap:10px;margin-top:26px;flex-wrap:wrap;justify-content:center;
}
.stat-pill{
  background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:9px 16px;font-size:13.5px;color:var(--teal-700);font-weight:600;
  box-shadow:var(--shadow);
}
[data-theme="dark"] .stat-pill{color:var(--teal-500)}
.start-btn{
  margin-top:34px;background:var(--coral-500);color:#fff;border:none;
  border-radius:999px;padding:16px 40px;font-size:17px;font-weight:600;
  box-shadow:0 10px 24px -8px rgba(224,105,63,.55);
  transition:transform .15s ease,box-shadow .15s ease;
}
.start-btn:hover{transform:translateY(-1px);box-shadow:0 14px 28px -8px rgba(224,105,63,.6)}
.start-btn:active{transform:translateY(0)}
.start-note{margin-top:14px;font-size:12.5px;color:var(--ink-500)}

/* ---------- Quiz shell ---------- */
.quiz-shell{display:none;padding-bottom:40px}
.quiz-shell.active{display:block}
.start-screen.hidden{display:none}

/* Header */
.quiz-header{
  position:sticky;top:0;z-index:20;background:var(--paper);
  padding:8px 0 10px;border-bottom:1px solid var(--line);
}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.app-name{font-size:clamp(14px,3.6vw,16px);font-weight:700;color:var(--ink-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-chip{
  display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;
  color:var(--teal-700);background:var(--teal-100);border-radius:999px;
  padding:6px 12px;white-space:nowrap;
}
[data-theme="dark"] .score-chip{color:var(--teal-500)}
.progress-track{
  margin-top:9px;height:6px;border-radius:999px;background:var(--line);overflow:hidden;
}
.progress-fill{
  height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--teal-600),var(--coral-500));
  transition:width .35s ease;
}

/* Section switcher */
.segmented{
  display:flex;background:var(--teal-50);border:1px solid var(--line);
  border-radius:999px;padding:4px;margin:14px 0 4px;gap:4px;
}
.segmented button{
  flex:1;border:none;background:transparent;border-radius:999px;
  padding:10px 8px;font-size:14px;font-weight:600;color:var(--ink-500);
  transition:background .2s ease,color .2s ease;
}
.segmented button.active{background:var(--card);color:var(--teal-700);box-shadow:var(--shadow)}
[data-theme="dark"] .segmented button.active{color:var(--teal-500)}

/* Question nav strip */
.qnav-wrap{margin:12px 0 4px}
.question-nav{
  display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:2px 2px 8px;
  scrollbar-width:thin;
}
.question-nav::-webkit-scrollbar{height:5px}
.question-nav::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px}
.qnav-dot{
  flex:0 0 auto;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);font-size:12.5px;font-weight:600;color:var(--ink-500);
  display:flex;align-items:center;justify-content:center;
}
.qnav-dot.current{border-color:var(--teal-600);color:var(--teal-700);box-shadow:0 0 0 2px var(--teal-100)}
.qnav-dot.correct{background:var(--good-bg);color:var(--good);border-color:transparent}
.qnav-dot.incorrect{background:var(--bad-bg);color:var(--bad);border-color:transparent}

/* Question card */
.q-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:clamp(18px,4vw,26px);margin-top:14px;box-shadow:var(--shadow);
  animation:cardIn .28s ease;
}
@keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.q-eyebrow{font-size:12.5px;font-weight:700;color:var(--teal-600);text-transform:none}
.q-counter{font-size:12.5px;color:var(--ink-500);font-weight:600}
.q-text{
  font-size:clamp(19px,4.6vw,23px);line-height:1.35;font-weight:600;color:var(--ink-900);
  margin-bottom:18px;
}

.answers{display:flex;flex-direction:column;gap:10px}
.answer-btn{
  display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;
  background:var(--paper);border:1.5px solid var(--line);border-radius:var(--radius-md);
  padding:13px 14px;font-size:clamp(15px,3.8vw,16.5px);color:var(--ink-900);
  transition:border-color .15s ease,background .15s ease,transform .1s ease;
  line-height:1.4;
}
.answer-btn:hover:not(:disabled){border-color:var(--teal-500)}
.answer-btn:active:not(:disabled){transform:scale(.995)}
.answer-btn:disabled{cursor:default}
.answer-letter{
  flex:0 0 auto;width:28px;height:28px;border-radius:8px;background:var(--teal-100);
  color:var(--teal-700);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;
}
[data-theme="dark"] .answer-letter{color:var(--teal-500)}
.answer-label{flex:1;padding-top:3px}
.answer-mark{flex:0 0 auto;font-size:15px;font-weight:700;padding-top:2px}

.answer-btn.selected-correct{background:var(--good-bg);border-color:var(--good)}
.answer-btn.selected-correct .answer-letter{background:var(--good);color:#fff}
.answer-btn.selected-correct .answer-mark{color:var(--good)}
.answer-btn.selected-incorrect{background:var(--bad-bg);border-color:var(--bad)}
.answer-btn.selected-incorrect .answer-letter{background:var(--bad);color:#fff}
.answer-btn.selected-incorrect .answer-mark{color:var(--bad)}
.answer-btn.reveal-correct{border-color:var(--good);background:var(--good-bg)}
.answer-btn.reveal-correct .answer-letter{background:var(--good);color:#fff}

.feedback-line{
  display:flex;align-items:center;gap:8px;margin-top:16px;font-weight:700;font-size:15px;
}
.feedback-line.good{color:var(--good)}
.feedback-line.bad{color:var(--bad)}

.explanation{
  margin-top:14px;background:var(--teal-50);border:1px solid var(--teal-100);
  border-radius:var(--radius-md);padding:14px 16px;
  font-size:clamp(14.5px,3.6vw,15.5px);color:var(--ink-700);line-height:1.55;
  animation:cardIn .25s ease;
}
.explanation strong{display:flex;align-items:center;gap:7px;color:var(--ink-900);margin-bottom:6px;font-size:14px}

/* Nav buttons */
.nav-row{display:flex;gap:10px;margin-top:18px}
.nav-btn{
  flex:1;border-radius:999px;padding:13px 10px;font-size:15px;font-weight:600;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink-900);
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:opacity .15s ease;
}
.nav-btn:disabled{opacity:.4;cursor:not-allowed}
.nav-btn.primary{background:var(--teal-700);border-color:var(--teal-700);color:#fff}
.nav-btn.primary:disabled{opacity:.45}
.nav-btn.finish{background:var(--coral-500);border-color:var(--coral-500);color:#fff}

/* ---------- Results ---------- */
.results-screen{display:none;padding:28px 0 48px}
.results-screen.active{display:block}
.results-hero{
  text-align:center;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:32px 20px;box-shadow:var(--shadow);
}
.results-icon{font-size:40px}
.results-title{font-size:clamp(20px,5vw,25px);font-weight:700;margin-top:8px}
.results-score{
  font-size:clamp(44px,12vw,60px);font-weight:800;margin-top:14px;color:var(--teal-700);
  line-height:1;
}
[data-theme="dark"] .results-score{color:var(--teal-500)}
.results-pct{color:var(--ink-500);font-size:15px;margin-top:6px}
.results-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:24px}
.results-stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-md);padding:14px 8px}
.results-stat .num{font-size:clamp(19px,5vw,24px);font-weight:700}
.results-stat .lbl{font-size:12px;color:var(--ink-500);margin-top:2px}
.results-stat.correct .num{color:var(--good)}
.results-stat.incorrect .num{color:var(--bad)}
.results-actions{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.results-actions .nav-btn{flex:none}

/* Review */
.review-screen{display:none;padding:20px 0 48px}
.review-screen.active{display:block}
.review-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back-btn{
  background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:9px 14px;font-size:14px;font-weight:600;color:var(--ink-900);
}
.review-title{font-size:18px;font-weight:700}
.review-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:18px;margin-bottom:12px;box-shadow:var(--shadow);
}
.review-q{font-size:16px;font-weight:600;margin-bottom:10px}
.review-row{font-size:14.5px;margin-bottom:6px;line-height:1.5}
.review-row b{font-weight:700}
.review-row.wrong{color:var(--bad)}
.review-row.right{color:var(--good)}
.review-explain{
  margin-top:8px;background:var(--teal-50);border-radius:var(--radius-sm);
  padding:10px 12px;font-size:14px;color:var(--ink-700);
}
.empty-review{text-align:center;color:var(--ink-500);padding:40px 10px;font-size:15px}

@media(min-width:640px){
  .nav-row{gap:14px}
  .results-actions{flex-direction:row}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <button class="theme-btn" id="themeToggle" aria-label="Toggle dark mode">
      <span id="themeIcon" aria-hidden="true">🌙</span><span id="themeLabel">Dark</span>
    </button>
  </div>

  <!-- START SCREEN -->
  <section class="start-screen" id="startScreen">
    <div class="start-emblem" aria-hidden="true">🧠</div>
    <h1 class="start-title">Female Reproductive Anatomy</h1>
    <p class="start-sub">Anatomy Practice Quiz</p>
    <div class="start-stats">
      <span class="stat-pill">63 Questions</span>
      <span class="stat-pill">48 MCQ</span>
      <span class="stat-pill">15 True / False</span>
    </div>
    <button class="start-btn" id="startBtn">Start Quiz</button>
    <p class="start-note">Your progress stays on this device only.</p>
  </section>

  <!-- QUIZ SHELL -->
  <section class="quiz-shell" id="quizShell">
    <header class="quiz-header">
      <div class="header-row">
        <h1 class="app-name">Reproductive Anatomy</h1>
        <div class="score-chip"><span aria-hidden="true">🎯</span><span id="scoreText">0 / 0</span></div>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </header>

    <div class="segmented" role="tablist" aria-label="Question section">
      <button role="tab" id="tabMcq" class="active" aria-selected="true">MCQ</button>
      <button role="tab" id="tabTf" aria-selected="false">True / False</button>
    </div>

    <div class="qnav-wrap">
      <nav class="question-nav" id="questionNav" aria-label="Question navigator"></nav>
    </div>

    <div class="q-card" id="qCard">
      <div class="q-meta">
        <span class="q-eyebrow" id="qEyebrow">Question</span>
        <span class="q-counter" id="qCounter">1 / 63</span>
      </div>
      <p class="q-text" id="qText"></p>
      <div class="answers" id="answersWrap"></div>
      <div id="feedbackWrap" aria-live="polite"></div>
      <div id="explainWrap"></div>
    </div>

    <div class="nav-row">
      <button class="nav-btn" id="prevBtn">← Previous</button>
      <button class="nav-btn primary" id="nextBtn" disabled>Next →</button>
    </div>
  </section>

  <!-- RESULTS -->
  <section class="results-screen" id="resultsScreen">
    <div class="results-hero">
      <div class="results-icon" aria-hidden="true">🎯</div>
      <h2 class="results-title">Final Score</h2>
      <div class="results-score" id="resultsScore">0 / 63</div>
      <div class="results-pct" id="resultsPct">0%</div>
      <div class="results-grid">
        <div class="results-stat correct"><div class="num" id="statCorrect">0</div><div class="lbl">Correct</div></div>
        <div class="results-stat incorrect"><div class="num" id="statIncorrect">0</div><div class="lbl">Incorrect</div></div>
        <div class="results-stat"><div class="num" id="statTotal">63</div><div class="lbl">Total</div></div>
      </div>
      <div class="results-actions">
        <button class="nav-btn" id="reviewBtn">Review Wrong Answers</button>
        <button class="nav-btn finish" id="retakeBtn">Retake Quiz</button>
      </div>
    </div>
  </section>

  <!-- REVIEW -->
  <section class="review-screen" id="reviewScreen">
    <div class="review-head">
      <button class="back-btn" id="backFromReview">← Back</button>
      <h2 class="review-title">Wrong Answers</h2>
    </div>
    <div id="reviewList"></div>
  </section>

</div>

<script>
(function(){
"use strict";

/* ---------------- Data ---------------- */
const questions = [
{id:1,type:"mcq",question:"The triangular mound of fatty tissue that covers the pubic bone is called:",options:["Mons Pubis","Labia Majora","Perineum","Vestibule"],answer:"Mons Pubis",explanation:"The Mons Pubis is a triangular mound of fatty tissue overlying the pubic bone."},
{id:2,type:"mcq",question:"The primary function of the Mons Pubis is to:",options:["Protect pelvic bones during intercourse","Secretes alkaline fluid","Site of fertilization","Dilation during labor"],answer:"Protect pelvic bones during intercourse",explanation:"Its main function is to protect pelvic bones from force and friction during intercourse."},
{id:3,type:"mcq",question:"Labia Majora extend from the Mons Pubis to the:",options:["Perineum","Clitoris","Cervix","Urethral orifice"],answer:"Perineum",explanation:"The Labia Majora extend downward from the mons pubis to the perineum."},
{id:4,type:"mcq",question:"Labia Majora are covered with hair and which type of glands?",options:["Sebaceous glands","Thyroid glands","Adrenal glands","Salivary glands"],answer:"Sebaceous glands",explanation:"The outer surfaces of the labia majora are covered with hair and sebaceous (oil) glands."},
{id:5,type:"mcq",question:"Which statement describes the Labia Minora?",options:["Paired erectile tissue folds located inside Labia Majora","Fleshy fat folds outside","Non-sensitive skin covering anus","Glands secreting alkaline mucus"],answer:"Paired erectile tissue folds located inside Labia Majora",explanation:"Labia Minora are paired folds of erectile tissue located inside the labia majora."},
{id:6,type:"mcq",question:"Compared to Labia Majora, the Labia Minora are:",options:["More sensitive and responsive to touch","Less sensitive","Covered with coarse hair","Non-erectile tissue"],answer:"More sensitive and responsive to touch",explanation:"The labia minora contain a rich nerve supply and are more sensitive to touch."},
{id:7,type:"mcq",question:"The Clitoris is located at the:",options:["Apex of the Labia Minora","Posterior two-thirds of vestibule","Lower part of perineum","Lateral side of vaginal orifice"],answer:"Apex of the Labia Minora",explanation:"The clitoris is situated at the apex where the labia minora meet."},
{id:8,type:"mcq",question:"The Clitoris is highly rich in which supplies?",options:["Blood and nerve supplies","Bone and cartilage supplies","Fat supplies only","Sebaceous glands only"],answer:"Blood and nerve supplies",explanation:"The clitoris is extremely rich in vascular blood supply and sensory nerve endings."},
{id:9,type:"mcq",question:"The shape of the Vestibule is described as:",options:["Boat shape","Round shape","Triangular shape","Square shape"],answer:"Boat shape",explanation:"The vestibule is a boat-shaped area enclosed between the labia minora."},
{id:10,type:"mcq",question:"The Urethral Orifice lies approximately:",options:["2.5cm posterior to the clitoris","4cm anterior to clitoris","Inside the anus","10cm behind perineum"],answer:"2.5cm posterior to the clitoris",explanation:"The external urethral opening lies roughly 2.5 cm behind the clitoris."},
{id:11,type:"mcq",question:"The length of the female Urethral path is:",options:["4cm","2.5cm","8cm","10cm"],answer:"4cm",explanation:"The female urethra measures approximately 4 cm in length."},
{id:12,type:"mcq",question:"Skene's glands are situated on either side of the Urethral Orifice to:",options:["Secretes fluid to lubricate the vestibule","Produce estrogen","Seal the hymen","Support digestive tract"],answer:"Secretes fluid to lubricate the vestibule",explanation:"Skene's ducts open near the urethral orifice and secrete fluid to lubricate the vestibule."},
{id:13,type:"mcq",question:"The Vaginal Orifice occupies which portion of the Vestibule?",options:["Posterior two-thirds","Anterior one-third","Apex only","Upper half"],answer:"Posterior two-thirds",explanation:"The vaginal introitus occupies the posterior two-thirds of the vestibule."},
{id:14,type:"mcq",question:"The thin elastic membrane that partially closes the vaginal orifice is the:",options:["Hymen","Prepuce","Perineum","Skene's duct"],answer:"Hymen",explanation:"The hymen is a thin, elastic membrane partially closing the vaginal opening."},
{id:15,type:"mcq",question:"Bartholin's glands secrete mucus with which pH property?",options:["Alkaline pH","Highly acidic pH","Neutral pH","Saline property"],answer:"Alkaline pH",explanation:"Bartholin's glands secrete thick mucus with an alkaline pH to neutralize acidity."},
{id:16,type:"mcq",question:"The function of Bartholin's glands secretion is to:",options:["Enhance viability and motility of sperm","Kill sperm cells","Grow pubic hair","Prevent labor contractions"],answer:"Enhance viability and motility of sperm",explanation:"The alkaline secretion enhances the viability and motility of sperm cells."},
{id:17,type:"mcq",question:"The Perineum is located between:",options:["Vaginal opening and anal canal","Clitoris and mons pubis","Uterus and fallopian tubes","Bladder and ovaries"],answer:"Vaginal opening and anal canal",explanation:"The perineum is the tissue region situated between the vaginal opening and the anus."},
{id:18,type:"mcq",question:"A surgical incision in the perineum during childbirth to widen vaginal opening is called:",options:["Episiotomy","Hymenectomy","Hysterectomy","Oophorectomy"],answer:"Episiotomy",explanation:"An episiotomy is a surgical incision made in the perineum during delivery."},
{id:19,type:"mcq",question:"Which structure connects the cervix to the external genitals?",options:["Vagina","Uterus","Fallopian tube","Ovary"],answer:"Vagina",explanation:"The vagina connects the cervix of the uterus to the external genitalia."},
{id:20,type:"mcq",question:"The length of the Anterior wall of the Vagina is:",options:["8-9 cm","10-11 cm","4 cm","2.5 cm"],answer:"8-9 cm",explanation:"The anterior wall of the vagina measures 8 to 9 cm."},
{id:21,type:"mcq",question:"The length of the Posterior wall of the Vagina is:",options:["10-11 cm","8-9 cm","5 cm","15 cm"],answer:"10-11 cm",explanation:"The posterior wall of the vagina measures 10 to 11 cm."},
{id:22,type:"mcq",question:"The primary functions of the Vagina include acting as a passageway for menstrual flow, birth canal, and:",options:["Passage for uterine secretions","Site of fertilization","Production of eggs","Storage of urine"],answer:"Passage for uterine secretions",explanation:"It allows passage for menstrual flow, uterine secretions, and serves as the birth canal."},

];

/* ---------------- State ---------------- */
let state = {
  section:"mcq",          // "mcq" | "tf"
  order:{mcq:[],tf:[]},   // shuffled question objects per section (with shuffled options)
  index:{mcq:0,tf:0},
  answers:{},             // id -> {selected, correct}
};

const STORAGE_KEY="anatomyQuizState_v1";
const THEME_KEY="anatomyQuizTheme_v1";
let storageOk = true;
try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); }catch(e){ storageOk=false; }

/* ---------------- Utilities ---------------- */
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildOrder(){
  const mcqSrc = shuffle(questions.filter(q=>q.type==="mcq"));
  const tfSrc  = shuffle(questions.filter(q=>q.type==="tf"));
  state.order.mcq = mcqSrc.map(q=>({...q, options: q.type==="mcq" ? shuffle(q.options) : q.options}));
  state.order.tf  = tfSrc.map(q=>({...q}));
  state.index = {mcq:0,tf:0};
  state.answers = {};
}

function saveState(){
  if(!storageOk) return;
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }catch(e){ /* fail silently, quiz keeps working in-memory */ }
}

function currentList(){ return state.order[state.section]; }
function currentIndex(){ return state.index[state.section]; }
function currentQuestion(){ return currentList()[currentIndex()]; }
function totalAnswered(){ return Object.keys(state.answers).length; }
function totalCorrect(){ return Object.values(state.answers).filter(a=>a.correct).length; }

/* ---------------- DOM refs ---------------- */
const startScreen=document.getElementById("startScreen");
const quizShell=document.getElementById("quizShell");
const resultsScreen=document.getElementById("resultsScreen");
const reviewScreen=document.getElementById("reviewScreen");

const startBtn=document.getElementById("startBtn");
const tabMcq=document.getElementById("tabMcq");
const tabTf=document.getElementById("tabTf");
const questionNav=document.getElementById("questionNav");
const qEyebrow=document.getElementById("qEyebrow");
const qCounter=document.getElementById("qCounter");
const qText=document.getElementById("qText");
const answersWrap=document.getElementById("answersWrap");
const feedbackWrap=document.getElementById("feedbackWrap");
const explainWrap=document.getElementById("explainWrap");
const prevBtn=document.getElementById("prevBtn");
const nextBtn=document.getElementById("nextBtn");
const scoreText=document.getElementById("scoreText");
const progressFill=document.getElementById("progressFill");

const resultsScore=document.getElementById("resultsScore");
const resultsPct=document.getElementById("resultsPct");
const statCorrect=document.getElementById("statCorrect");
const statIncorrect=document.getElementById("statIncorrect");
const statTotal=document.getElementById("statTotal");
const reviewBtn=document.getElementById("reviewBtn");
const retakeBtn=document.getElementById("retakeBtn");
const backFromReview=document.getElementById("backFromReview");
const reviewList=document.getElementById("reviewList");

const themeToggle=document.getElementById("themeToggle");
const themeIcon=document.getElementById("themeIcon");
const themeLabel=document.getElementById("themeLabel");

/* ---------------- Theme ---------------- */
function applyTheme(mode){
  document.documentElement.setAttribute("data-theme", mode);
  themeIcon.textContent = mode==="dark" ? "☀️" : "🌙";
  themeLabel.textContent = mode==="dark" ? "Light" : "Dark";
  if(storageOk){ try{ localStorage.setItem(THEME_KEY, mode); }catch(e){} }
}
(function initTheme(){
  let mode="light";
  if(storageOk){
    try{
      const saved=localStorage.getItem(THEME_KEY);
      if(saved){ mode=saved; }
      else if(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches){ mode="dark"; }
    }catch(e){}
  }
  applyTheme(mode);
})();
themeToggle.addEventListener("click",()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  applyTheme(cur==="dark" ? "light" : "dark");
});

/* ---------------- Rendering ---------------- */
function renderHeader(){
  const total = questions.length;
  scoreText.textContent = `${totalCorrect()} / ${total}`;
  progressFill.style.width = `${(totalAnswered()/total)*100}%`;
}

function renderNav(){
  questionNav.innerHTML="";
  currentList().forEach((q,i)=>{
    const dot=document.createElement("button");
    dot.type="button";
    dot.className="qnav-dot";
    dot.textContent = i+1;
    dot.setAttribute("aria-label", `Go to question ${i+1}`);
    const rec = state.answers[q.id];
    if(i===currentIndex()) dot.classList.add("current");
    else if(rec) dot.classList.add(rec.correct ? "correct" : "incorrect");
    dot.addEventListener("click",()=>{ state.index[state.section]=i; renderQuestion(); });
    questionNav.appendChild(dot);
  });
  const activeDot = questionNav.children[currentIndex()];
  if(activeDot) activeDot.scrollIntoView({inline:"center", block:"nearest"});
}

function letterFor(i){ return String.fromCharCode(65+i); }

function renderQuestion(){
  const q = currentQuestion();
  const idxInSection = currentIndex();
  qEyebrow.textContent = q.type==="mcq" ? "Multiple Choice" : "True / False";
  qCounter.textContent = `${idxInSection+1} / ${currentList().length}`;
  qText.textContent = q.question;

  answersWrap.innerHTML="";
  feedbackWrap.innerHTML="";
  explainWrap.innerHTML="";

  const rec = state.answers[q.id];

  q.options.forEach((opt,i)=>{
    const btn=document.createElement("button");
    btn.type="button";
    btn.className="answer-btn";
    btn.innerHTML = `<span class="answer-letter">${letterFor(i)}</span><span class="answer-label">${opt}</span><span class="answer-mark"></span>`;
    if(rec){
      btn.disabled=true;
      if(opt===rec.selected && opt===q.answer){ btn.classList.add("selected-correct"); btn.querySelector(".answer-mark").textContent="✓"; }
      else if(opt===rec.selected && opt!==q.answer){ btn.classList.add("selected-incorrect"); btn.querySelector(".answer-mark").textContent="✕"; }
      else if(opt===q.answer){ btn.classList.add("reveal-correct"); btn.querySelector(".answer-mark").textContent="✓"; }
    } else {
      btn.addEventListener("click",()=>selectAnswer(q,opt));
    }
    answersWrap.appendChild(btn);
  });

  if(rec){ showFeedback(q, rec); }
  nextBtn.disabled = !rec;
  prevBtn.disabled = (idxInSection===0);

  const isLast = idxInSection === currentList().length-1;
  nextBtn.classList.toggle("finish", isLast);
  nextBtn.textContent = isLast ? "Finish Quiz" : "Next →";

  renderNav();
  renderHeader();
}

function showFeedback(q, rec){
  const good = rec.correct;
  feedbackWrap.innerHTML = `<div class="feedback-line ${good?'good':'bad'}">
    <span aria-hidden="true">${good?'✓':'✕'}</span>
    <span>${good?'Correct!':`Incorrect — correct answer: ${q.answer}`}</span>
  </div>`;
  explainWrap.innerHTML = `<div class="explanation"><strong><span aria-hidden="true">💡</span> Explanation</strong>${q.explanation}</div>`;
}

function selectAnswer(q, opt){
  if(state.answers[q.id]) return;
  const correct = opt===q.answer;
  state.answers[q.id] = {selected:opt, correct};
  saveState();
  renderQuestion();
}

function nextQuestion(){
  const list = currentList();
  const idx = currentIndex();
  if(idx < list.length-1){
    state.index[state.section] = idx+1;
    renderQuestion();
  } else {
    // finishing current section: if the other section still has unanswered items, hop there; else show results
    const other = state.section==="mcq" ? "tf" : "mcq";
    const otherUnanswered = state.order[other].some(q=>!state.answers[q.id]);
    const allDone = totalAnswered() >= questions.length;
    if(allDone){
      showResults();
    } else if(otherUnanswered){
      state.section = other;
      updateTabs();
      renderQuestion();
    } else {
      showResults();
    }
  }
}

function previousQuestion(){
  const idx = currentIndex();
  if(idx>0){
    state.index[state.section]=idx-1;
    renderQuestion();
  }
}

function updateTabs(){
  const mcqActive = state.section==="mcq";
  tabMcq.classList.toggle("active", mcqActive);
  tabMcq.setAttribute("aria-selected", mcqActive);
  tabTf.classList.toggle("active", !mcqActive);
  tabTf.setAttribute("aria-selected", !mcqActive);
}

/* ---------------- Results & Review ---------------- */
function showResults(){
  quizShell.classList.remove("active");
  reviewScreen.classList.remove("active");
  resultsScreen.classList.add("active");

  const total = questions.length;
  const correct = totalCorrect();
  const incorrect = totalAnswered() - correct;
  resultsScore.textContent = `${correct} / ${total}`;
  resultsPct.textContent = `${Math.round((correct/total)*100)}% correct`;
  statCorrect.textContent = correct;
  statIncorrect.textContent = incorrect;
  statTotal.textContent = total;
}

function showReview(){
  resultsScreen.classList.remove("active");
  reviewScreen.classList.add("active");
  reviewList.innerHTML="";

  const wrong = [];
  [...state.order.mcq, ...state.order.tf].forEach(q=>{
    const rec = state.answers[q.id];
    if(rec && !rec.correct) wrong.push({q,rec});
  });

  if(wrong.length===0){
    reviewList.innerHTML = `<div class="empty-review">You answered every question correctly. Nothing to review!</div>`;
    return;
  }

  wrong.forEach(({q,rec})=>{
    const card=document.createElement("div");
    card.className="review-card";
    card.innerHTML = `
      <div class="review-q">${q.question}</div>
      <div class="review-row wrong"><b>Your answer:</b> ${rec.selected}</div>
      <div class="review-row right"><b>Correct answer:</b> ${q.answer}</div>
      <div class="review-explain">${q.explanation}</div>
    `;
    reviewList.appendChild(card);
  });
}

function retakeQuiz(){
  buildOrder();
  reviewScreen.classList.remove("active");
  resultsScreen.classList.remove("active");
  quizShell.classList.add("active");
  state.section="mcq";
  updateTabs();
  renderQuestion();
  saveState();
}

/* ---------------- Wire up ---------------- */
startBtn.addEventListener("click",()=>{
  buildOrder();
  startScreen.classList.add("hidden");
  quizShell.classList.add("active");
  updateTabs();
  renderQuestion();
  saveState();
});

tabMcq.addEventListener("click",()=>{ if(state.section!=="mcq"){ state.section="mcq"; updateTabs(); renderQuestion(); }});
tabTf.addEventListener("click",()=>{ if(state.section!=="tf"){ state.section="tf"; updateTabs(); renderQuestion(); }});

prevBtn.addEventListener("click",previousQuestion);
nextBtn.addEventListener("click",nextQuestion);

reviewBtn.addEventListener("click",showReview);
retakeBtn.addEventListener("click",retakeQuiz);
backFromReview.addEventListener("click",()=>{
  reviewScreen.classList.remove("active");
  resultsScreen.classList.add("active");
});

})();
</script>
