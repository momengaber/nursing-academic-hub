<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Female Reproductive Anatomy — Question Bank</title>
<style>
:root{
  --teal-900:#0a2e2e;
  --teal-800:#0f3d3d;
  --teal-700:#155454;
  --teal-600:#1c6b6b;
  --teal-500:#238484;
  --teal-100:#e3f1ef;
  --teal-50:#f2f8f7;
  --coral-500:#e0693f;
  --coral-600:#c9552e;
  --ink-900:#132524;
  --ink-700:#3a4d4c;
  --ink-500:#647877;
  --paper:#fbfaf7;
  --card:#ffffff;
  --line:#dde6e4;
  --good:#1c7d5a;
  --good-bg:#e5f5ee;
  --bad:#b4402a;
  --bad-bg:#fbeae6;
  --radius-lg:18px;
  --radius-md:12px;
  --radius-sm:8px;
  --shadow:0 1px 2px rgba(19,37,36,.06), 0 8px 24px -12px rgba(19,37,36,.18);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
[data-theme="dark"]{
  --paper:#0c1a19;
  --card:#122624;
  --line:#1f3735;
  --ink-900:#eef5f3;
  --ink-700:#c3d3d0;
  --ink-500:#8ba4a1;
  --teal-100:#173836;
  --teal-50:#102422;
  --good-bg:#123227;
  --bad-bg:#331d18;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{
  margin:0;
  font-family:var(--font);
  background:var(--paper);
  color:var(--ink-900);
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
  transition:background .25s ease,color .25s ease;
}
.app{
  max-width:900px;
  margin:0 auto;
  padding-left:max(14px,env(safe-area-inset-left));
  padding-right:max(14px,env(safe-area-inset-right));
}
button{font-family:inherit;cursor:pointer;min-height:44px}
h1,h2,h3,p{margin:0}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--coral-500);outline-offset:2px}

/* ---------- Top bar / theme toggle (global) ---------- */
.topbar{display:flex;justify-content:flex-end;padding:10px 0 0}
.theme-btn{
  display:flex;align-items:center;gap:6px;
  background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:8px 14px;font-size:14px;color:var(--ink-700);
  box-shadow:var(--shadow);
}

/* ---------- Start screen ---------- */
.start-screen{
  min-height:calc(100vh - 60px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:32px 8px 48px;gap:0;
}
.start-emblem{
  width:76px;height:76px;border-radius:22px;
  background:linear-gradient(155deg,var(--teal-600),var(--teal-800));
  display:flex;align-items:center;justify-content:center;
  font-size:34px;box-shadow:var(--shadow);margin-bottom:22px;
}
.start-title{
  font-size:clamp(26px,6vw,38px);font-weight:700;letter-spacing:-.01em;
  color:var(--ink-900);line-height:1.15;max-width:520px;
}
.start-sub{
  margin-top:10px;color:var(--ink-500);font-size:clamp(15px,3.6vw,17px);
}
.start-stats{
  display:flex;gap:10px;margin-top:26px;flex-wrap:wrap;justify-content:center;
}
.stat-pill{
  background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:9px 16px;font-size:13.5px;color:var(--teal-700);font-weight:600;
  box-shadow:var(--shadow);
}
[data-theme="dark"] .stat-pill{color:var(--teal-500)}
.start-btn{
  margin-top:34px;background:var(--coral-500);color:#fff;border:none;
  border-radius:999px;padding:16px 40px;font-size:17px;font-weight:600;
  box-shadow:0 10px 24px -8px rgba(224,105,63,.55);
  transition:transform .15s ease,box-shadow .15s ease;
}
.start-btn:hover{transform:translateY(-1px);box-shadow:0 14px 28px -8px rgba(224,105,63,.6)}
.start-btn:active{transform:translateY(0)}
.start-note{margin-top:14px;font-size:12.5px;color:var(--ink-500)}

/* ---------- Quiz shell ---------- */
.quiz-shell{display:none;padding-bottom:40px}
.quiz-shell.active{display:block}
.start-screen.hidden{display:none}

/* Header */
.quiz-header{
  position:sticky;top:0;z-index:20;background:var(--paper);
  padding:8px 0 10px;border-bottom:1px solid var(--line);
}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.app-name{font-size:clamp(14px,3.6vw,16px);font-weight:700;color:var(--ink-900);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score-chip{
  display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;
  color:var(--teal-700);background:var(--teal-100);border-radius:999px;
  padding:6px 12px;white-space:nowrap;
}
[data-theme="dark"] .score-chip{color:var(--teal-500)}
.progress-track{
  margin-top:9px;height:6px;border-radius:999px;background:var(--line);overflow:hidden;
}
.progress-fill{
  height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--teal-600),var(--coral-500));
  transition:width .35s ease;
}

/* Section switcher */
.segmented{
  display:flex;background:var(--teal-50);border:1px solid var(--line);
  border-radius:999px;padding:4px;margin:14px 0 4px;gap:4px;
}
.segmented button{
  flex:1;border:none;background:transparent;border-radius:999px;
  padding:10px 8px;font-size:14px;font-weight:600;color:var(--ink-500);
  transition:background .2s ease,color .2s ease;
}
.segmented button.active{background:var(--card);color:var(--teal-700);box-shadow:var(--shadow)}
[data-theme="dark"] .segmented button.active{color:var(--teal-500)}

/* Question nav strip */
.qnav-wrap{margin:12px 0 4px}
.question-nav{
  display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:2px 2px 8px;
  scrollbar-width:thin;
}
.question-nav::-webkit-scrollbar{height:5px}
.question-nav::-webkit-scrollbar-thumb{background:var(--line);border-radius:999px}
.qnav-dot{
  flex:0 0 auto;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);font-size:12.5px;font-weight:600;color:var(--ink-500);
  display:flex;align-items:center;justify-content:center;
}
.qnav-dot.current{border-color:var(--teal-600);color:var(--teal-700);box-shadow:0 0 0 2px var(--teal-100)}
.qnav-dot.correct{background:var(--good-bg);color:var(--good);border-color:transparent}
.qnav-dot.incorrect{background:var(--bad-bg);color:var(--bad);border-color:transparent}

/* Question card */
.q-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:clamp(18px,4vw,26px);margin-top:14px;box-shadow:var(--shadow);
  animation:cardIn .28s ease;
}
@keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.q-eyebrow{font-size:12.5px;font-weight:700;color:var(--teal-600);text-transform:none}
.q-counter{font-size:12.5px;color:var(--ink-500);font-weight:600}
.q-text{
  font-size:clamp(19px,4.6vw,23px);line-height:1.35;font-weight:600;color:var(--ink-900);
  margin-bottom:18px;
}

.answers{display:flex;flex-direction:column;gap:10px}
.answer-btn{
  display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;
  background:var(--paper);border:1.5px solid var(--line);border-radius:var(--radius-md);
  padding:13px 14px;font-size:clamp(15px,3.8vw,16.5px);color:var(--ink-900);
  transition:border-color .15s ease,background .15s ease,transform .1s ease;
  line-height:1.4;
}
.answer-btn:hover:not(:disabled){border-color:var(--teal-500)}
.answer-btn:active:not(:disabled){transform:scale(.995)}
.answer-btn:disabled{cursor:default}
.answer-letter{
  flex:0 0 auto;width:28px;height:28px;border-radius:8px;background:var(--teal-100);
  color:var(--teal-700);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;
}
[data-theme="dark"] .answer-letter{color:var(--teal-500)}
.answer-label{flex:1;padding-top:3px}
.answer-mark{flex:0 0 auto;font-size:15px;font-weight:700;padding-top:2px}

.answer-btn.selected-correct{background:var(--good-bg);border-color:var(--good)}
.answer-btn.selected-correct .answer-letter{background:var(--good);color:#fff}
.answer-btn.selected-correct .answer-mark{color:var(--good)}
.answer-btn.selected-incorrect{background:var(--bad-bg);border-color:var(--bad)}
.answer-btn.selected-incorrect .answer-letter{background:var(--bad);color:#fff}
.answer-btn.selected-incorrect .answer-mark{color:var(--bad)}
.answer-btn.reveal-correct{border-color:var(--good);background:var(--good-bg)}
.answer-btn.reveal-correct .answer-letter{background:var(--good);color:#fff}

.feedback-line{
  display:flex;align-items:center;gap:8px;margin-top:16px;font-weight:700;font-size:15px;
}
.feedback-line.good{color:var(--good)}
.feedback-line.bad{color:var(--bad)}

.explanation{
  margin-top:14px;background:var(--teal-50);border:1px solid var(--teal-100);
  border-radius:var(--radius-md);padding:14px 16px;
  font-size:clamp(14.5px,3.6vw,15.5px);color:var(--ink-700);line-height:1.55;
  animation:cardIn .25s ease;
}
.explanation strong{display:flex;align-items:center;gap:7px;color:var(--ink-900);margin-bottom:6px;font-size:14px}

/* Nav buttons */
.nav-row{display:flex;gap:10px;margin-top:18px}
.nav-btn{
  flex:1;border-radius:999px;padding:13px 10px;font-size:15px;font-weight:600;
  border:1.5px solid var(--line);background:var(--card);color:var(--ink-900);
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:opacity .15s ease;
}
.nav-btn:disabled{opacity:.4;cursor:not-allowed}
.nav-btn.primary{background:var(--teal-700);border-color:var(--teal-700);color:#fff}
.nav-btn.primary:disabled{opacity:.45}
.nav-btn.finish{background:var(--coral-500);border-color:var(--coral-500);color:#fff}

/* ---------- Results ---------- */
.results-screen{display:none;padding:28px 0 48px}
.results-screen.active{display:block}
.results-hero{
  text-align:center;background:var(--card);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:32px 20px;box-shadow:var(--shadow);
}
.results-icon{font-size:40px}
.results-title{font-size:clamp(20px,5vw,25px);font-weight:700;margin-top:8px}
.results-score{
  font-size:clamp(44px,12vw,60px);font-weight:800;margin-top:14px;color:var(--teal-700);
  line-height:1;
}
[data-theme="dark"] .results-score{color:var(--teal-500)}
.results-pct{color:var(--ink-500);font-size:15px;margin-top:6px}
.results-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:24px}
.results-stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-md);padding:14px 8px}
.results-stat .num{font-size:clamp(19px,5vw,24px);font-weight:700}
.results-stat .lbl{font-size:12px;color:var(--ink-500);margin-top:2px}
.results-stat.correct .num{color:var(--good)}
.results-stat.incorrect .num{color:var(--bad)}
.results-actions{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.results-actions .nav-btn{flex:none}

/* Review */
.review-screen{display:none;padding:20px 0 48px}
.review-screen.active{display:block}
.review-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back-btn{
  background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:9px 14px;font-size:14px;font-weight:600;color:var(--ink-900);
}
.review-title{font-size:18px;font-weight:700}
.review-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:18px;margin-bottom:12px;box-shadow:var(--shadow);
}
.review-q{font-size:16px;font-weight:600;margin-bottom:10px}
.review-row{font-size:14.5px;margin-bottom:6px;line-height:1.5}
.review-row b{font-weight:700}
.review-row.wrong{color:var(--bad)}
.review-row.right{color:var(--good)}
.review-explain{
  margin-top:8px;background:var(--teal-50);border-radius:var(--radius-sm);
  padding:10px 12px;font-size:14px;color:var(--ink-700);
}
.empty-review{text-align:center;color:var(--ink-500);padding:40px 10px;font-size:15px}

@media(min-width:640px){
  .nav-row{gap:14px}
  .results-actions{flex-direction:row}
}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* ---------- Modules screen ---------- */
.start-screen{justify-content:flex-start;padding-top:28px}
.module-list{width:100%;max-width:640px;display:grid;gap:12px;margin-top:26px;text-align:left}
.module-card{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius-lg);
  padding:16px 18px;color:var(--ink-900);box-shadow:var(--shadow);
  transition:border-color .15s ease,transform .1s ease;
}
.module-card:hover{border-color:var(--teal-500)}
.module-card:active{transform:scale(.995)}
.module-card.all{background:var(--teal-50)}
.module-body{flex:1;min-width:0}
.module-title{display:block;font-size:clamp(16px,4.2vw,18px);font-weight:700;line-height:1.3}
.module-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.module-pills .stat-pill{padding:4px 10px;font-size:12.5px;box-shadow:none;background:var(--paper)}
.module-go{flex:0 0 auto;font-size:20px;color:var(--coral-500);font-weight:700}
.header-row .back-btn{min-height:38px;padding:7px 12px;flex:0 0 auto;white-space:nowrap}
.header-row .app-name{flex:1;min-width:0;text-align:center}

/* ---------- Matching ---------- */
.match-hint{font-size:13.5px;color:var(--ink-500);margin:-8px 0 14px}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%}
.match-col{min-width:0}
.match-col h3{font-size:13px;font-weight:700;color:var(--teal-600);margin-bottom:8px}
.match-row,.match-b{
  display:flex;gap:10px;align-items:flex-start;background:var(--paper);
  border:1.5px solid var(--line);border-radius:var(--radius-md);padding:10px 12px;margin-bottom:8px;
  font-size:clamp(14.5px,3.6vw,15.5px);line-height:1.4;overflow-wrap:anywhere;
}
.match-num,.match-letter{
  flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--teal-100);color:var(--teal-700);
  font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;
}
[data-theme="dark"] .match-num,[data-theme="dark"] .match-letter{color:var(--teal-500)}
.match-main{flex:1;min-width:0}
.match-select{
  display:block;width:100%;max-width:100%;margin-top:8px;min-height:44px;padding:8px 10px;
  font:inherit;font-size:16px;color:var(--ink-900);background:var(--card);
  border:1.5px solid var(--line);border-radius:var(--radius-sm);
}
.match-select:disabled{opacity:1;cursor:default}
.match-row.ok{background:var(--good-bg);border-color:var(--good)}
.match-row.bad{background:var(--bad-bg);border-color:var(--bad)}
.match-fix{margin-top:8px;font-size:13.5px;color:var(--good);font-weight:600}
.match-submit{margin-top:6px;width:100%;flex:none}
@media(max-width:640px){.match-grid{grid-template-columns:1fr;gap:6px}}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <button class="theme-btn" id="themeToggle" aria-label="Toggle dark mode">
      <span id="themeIcon" aria-hidden="true">🌙</span><span id="themeLabel">Dark</span>
    </button>
  </div>

  <!-- MODULES SCREEN -->
  <section class="start-screen" id="modulesScreen">
    <div class="start-emblem" aria-hidden="true">🧠</div>
    <h1 class="start-title">Female Reproductive Anatomy</h1>
    <p class="start-sub">Question Bank — Choose a Module</p>
    <div class="start-stats" id="bankStats"></div>
    <div class="module-list" id="moduleList"></div>
    <p class="start-note">Multiple choice, true / false and matching questions.</p>
  </section>

  <!-- QUIZ SHELL -->
  <section class="quiz-shell" id="quizShell">
    <header class="quiz-header">
      <div class="header-row">
        <button class="back-btn" id="modulesBtn" type="button">← Modules</button>
        <h1 class="app-name" id="moduleName">Module</h1>
        <div class="score-chip"><span aria-hidden="true">🎯</span><span id="scoreText">0 / 0</span></div>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </header>

    <div class="qnav-wrap">
      <nav class="question-nav" id="questionNav" aria-label="Question navigator"></nav>
    </div>

    <div class="q-card" id="qCard">
      <div class="q-meta">
        <span class="q-eyebrow" id="qEyebrow">Question</span>
        <span class="q-counter" id="qCounter">1 / 1</span>
      </div>
      <p class="q-text" id="qText"></p>
      <div class="answers" id="answersWrap"></div>
      <div id="feedbackWrap" aria-live="polite"></div>
      <div id="explainWrap"></div>
    </div>

    <div class="nav-row">
      <button class="nav-btn" id="prevBtn">← Previous</button>
      <button class="nav-btn primary" id="nextBtn" disabled>Next →</button>
    </div>
  </section>

  <!-- RESULTS -->
  <section class="results-screen" id="resultsScreen">
    <div class="results-hero">
      <div class="results-icon" aria-hidden="true">🎯</div>
      <h2 class="results-title">Final Score</h2>
      <div class="results-score" id="resultsScore">0 / 0</div>
      <div class="results-pct" id="resultsPct">0%</div>
      <div class="results-grid">
        <div class="results-stat correct"><div class="num" id="statCorrect">0</div><div class="lbl">Correct</div></div>
        <div class="results-stat incorrect"><div class="num" id="statIncorrect">0</div><div class="lbl">Incorrect</div></div>
        <div class="results-stat"><div class="num" id="statTotal">0</div><div class="lbl">Total</div></div>
      </div>
      <div class="results-actions">
        <button class="nav-btn" id="reviewBtn">Review Wrong Answers</button>
        <button class="nav-btn finish" id="retakeBtn">Retake Quiz</button>
        <button class="nav-btn" id="resultsModulesBtn">← Modules</button>
      </div>
    </div>
  </section>

  <!-- REVIEW -->
  <section class="review-screen" id="reviewScreen">
    <div class="review-head">
      <button class="back-btn" id="backFromReview">← Back</button>
      <h2 class="review-title">Wrong Answers</h2>
    </div>
    <div id="reviewList"></div>
  </section>

</div>

<script>
(function(){
"use strict";

/* ================= QUESTION BANK ================= */
const modules=[
  {id:"female-anatomy",title:"Female Reproductive Anatomy",questions:[]},
  {id:"menstrual-cycle",title:"Menstrual Cycle",questions:[]},
  {id:"reproductive-health",title:"Reproductive Health",questions:[]},
  {id:"family-planning",title:"Family Planning & Contraception",questions:[]}
];
const A="female-anatomy",C="menstrual-cycle",H="reproductive-health",F="family-planning";
const byId={};modules.forEach(m=>{byId[m.id]=m;});
let nMcq=0,nTf=0;
const pad=n=>String(n).padStart(3,"0");
/* Q(module, poolTag, question, correctAnswer, [3 distractors] | null = draw from pool of same tag) */
function Q(mod,tag,q,a,d){
  byId[mod].questions.push({id:"mcq-"+pad(++nMcq),type:"mcq",question:q,answer:a,distractors:d,tag:tag,explanation:""});
}
function T(mod,q,v){
  byId[mod].questions.push({id:"tf-"+pad(++nTf),type:"truefalse",question:q,answer:v?"True":"False",explanation:""});
}

/* ---- Female Reproductive Anatomy (MCQ) ---- */
Q(A,"lst","External Genital (vulva) includes:","Mons pubis, Labia majora, Labia minora, Clitoris, Vestibule, Bartholin's glands, Perineum.",null);
Q(A,"vul","The function of mons pubis is:","Protect pelvic bones during intercourse.",null);
Q(A,"vul","Labia majora is described as:","Outer fleshy lips; covered with hair and sebaceous glands; protects inner delicate structures.",null);
Q(A,"vul","Labia minora is:","Paired erectile tissue lips.",null);
Q(A,"vul","Clitoris function is:","Primary center for female sexual pleasure.",null);
Q(A,"lst","The vestibule has 4 structures opening, they are:","External urethral orifice, Vaginal orifice, Ducts of Skene's glands, Ducts of Bartholin's glands.",null);
Q(A,"","Bartholin's glands lie in:","Posterior portion of the vestibule on either side of vaginal opening.",["Anterior portion of the vestibule near the clitoris.","The fatty tissue of the mons pubis.","Between the urethra and the neck of the bladder."]);

/* ================= UTILITIES ================= */
function shuffle(arr){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
const letterFor=i=>String.fromCharCode(65+i);
const maxPts=q=>q.type==="matching"?q.pairs.length:1;
const wordSet=s=>new Set(s.toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>2));
function similarity(a,b){
  const x=wordSet(a),y=wordSet(b);let n=0;
  x.forEach(w=>{if(y.has(w))n++;});
  return n/((x.size+y.size-n)||1);
}
function pickPoolDistractors(q){
  const seen=new Set([q.answer]);
  const cands=allQuestions.filter(x=>x.type==="mcq"&&x.tag&&x.tag===q.tag&&x.id!==q.id&&similarity(x.answer,q.answer)<0.5)
    .filter(x=>{if(seen.has(x.answer))return false;seen.add(x.answer);return true;});
  return shuffle(cands).slice(0,3).map(x=>x.answer);
}
function prepare(q){
  if(q.type==="mcq"){
    const d=q.distractors?q.distractors.slice():pickPoolDistractors(q);
    return Object.assign({},q,{options:shuffle([q.answer].concat(d))});
  }
  if(q.type==="truefalse")return Object.assign({},q,{options:["True","False"]});
  return Object.assign({},q,{order:shuffle(q.pairs.map((_,i)=>i))}); // order[pos] = pair index shown at Column B position pos
}
function buildAttempt(mod){
  const pick=t=>shuffle(mod.questions.filter(q=>q.type===t)).map(prepare);
  state.list=[].concat(pick("mcq"),pick("truefalse"),pick("matching"));
  state.index=0;state.answers={};state.draft={};
}
const totalPoints=()=>state.list.reduce((s,q)=>s+maxPts(q),0);
const earnedPoints=()=>Object.values(state.answers).reduce((s,a)=>s+a.points,0);
const answeredCount=()=>Object.keys(state.answers).length;
const currentQuestion=()=>state.list[state.index];

function applyTheme(mode){

  themeIcon.textContent=mode==="dark"?"☀️":"🌙";
  themeLabel.textContent=mode==="dark"?"Light":"Dark";
  if(storageOk){try{localStorage.setItem(THEME_KEY,mode);}catch(e){}}
}
(function initTheme(){
  let mode="light";
  if(storageOk){
    try{
      const saved=localStorage.getItem(THEME_KEY);
      if(saved)mode=saved;
      else if(window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches)mode="dark";
    }catch(e){}
  }
  applyTheme(mode);
})();

function counts(qs){

}
function pills(c){
  return `<span class="stat-pill">${c.total} Questions</span><span class="stat-pill">${c.mcq} MCQ</span><span class="stat-pill">${c.tf} True / False</span><span class="stat-pill">${c.match} Matching</span>`;
}

function renderHeader(){
  scoreText.textContent=`${earnedPoints()} / ${totalPoints()}`;
  progressFill.style.width=`${(answeredCount()/state.list.length)*100}%`;
}
function renderNav(){
  questionNav.innerHTML="";
  state.list.forEach((q,i)=>{
    const dot=document.createElement("button");
    dot.type="button";dot.className="qnav-dot";dot.textContent=i+1;
    dot.setAttribute("aria-label",`Go to question ${i+1}`);
    const rec=state.answers[q.id];
    if(i===state.index)dot.classList.add("current");
    else if(rec)dot.classList.add(rec.correct?"correct":"incorrect");
    dot.addEventListener("click",()=>{state.index=i;renderQuestion();});
    questionNav.appendChild(dot);
  });
  const active=questionNav.children[state.index];
  if(active)active.scrollIntoView({inline:"center",block:"nearest"});
}
const TYPE_LABEL={mcq:"Multiple Choice",truefalse:"True / False",matching:"Matching"};

function renderQuestion(){
  const q=currentQuestion(),rec=state.answers[q.id];
  qEyebrow.textContent=TYPE_LABEL[q.type];
  qCounter.textContent=`${state.index+1} / ${state.list.length}`;
  qText.textContent=q.question;
  answersWrap.innerHTML="";feedbackWrap.innerHTML="";explainWrap.innerHTML="";

  if(q.type==="matching")renderMatching(q,rec);else renderChoices(q,rec);
  if(rec)showFeedback(q,rec);

  nextBtn.disabled=!rec;
  prevBtn.disabled=state.index===0;
  const isLast=state.index===state.list.length-1;
  nextBtn.classList.toggle("finish",isLast);
  nextBtn.textContent=isLast?"Finish Quiz":"Next →";
  renderNav();renderHeader();
}

function renderChoices(q,rec){
  q.options.forEach((opt,i)=>{
    const btn=document.createElement("button");
    btn.type="button";btn.className="answer-btn";
    btn.innerHTML=`<span class="answer-letter">${letterFor(i)}</span><span class="answer-label">${esc(opt)}</span><span class="answer-mark"></span>`;
    const mark=btn.querySelector(".answer-mark");
    if(rec){
      btn.disabled=true;
      if(opt===rec.selected&&opt===q.answer){btn.classList.add("selected-correct");mark.textContent="✓";}
      else if(opt===rec.selected){btn.classList.add("selected-incorrect");mark.textContent="✕";}
      else if(opt===q.answer){btn.classList.add("reveal-correct");mark.textContent="✓";}
    }else{
      btn.addEventListener("click",()=>selectAnswer(q,opt));
    }
    answersWrap.appendChild(btn);
  });
}

function renderMatching(q,rec){
  const n=q.pairs.length;
  const sel=rec?rec.selected:(state.draft[q.id]||(state.draft[q.id]=Array(n).fill(-1)));
  const hint=document.createElement("p");
  hint.className="match-hint";
  hint.textContent="Choose the letter from Column B that matches each item in Column A.";
  const grid=document.createElement("div");grid.className="match-grid";
  const colA=document.createElement("div");colA.className="match-col";colA.innerHTML="<h3>Column A</h3>";
  const colB=document.createElement("div");colB.className="match-col";colB.innerHTML="<h3>Column B</h3>";

  q.order.forEach((pi,pos)=>{
    const b=document.createElement("div");b.className="match-b";
    b.innerHTML=`<span class="match-letter">${letterFor(pos)}</span><span>${esc(q.pairs[pi].right)}</span>`;
    colB.appendChild(b);
  });

  const selects=[];
  q.pairs.forEach((p,j)=>{
    const row=document.createElement("div");row.className="match-row";
    const s=document.createElement("select");
    s.className="match-select";
    s.setAttribute("aria-label",`Match for ${p.left}`);
    s.innerHTML=`<option value="-1">Select…</option>`+q.order.map((_,pos)=>`<option value="${pos}">${letterFor(pos)}</option>`).join("");
    s.value=String(sel[j]);
    row.innerHTML=`<span class="match-num">${j+1}</span><div class="match-main"><div class="match-left">${esc(p.left)}</div></div>`;
    row.querySelector(".match-main").appendChild(s);
    if(rec){
      s.disabled=true;
      const ok=q.order[sel[j]]===j;
      row.classList.add(ok?"ok":"bad");
      if(!ok){
        const cp=q.order.indexOf(j);
        const fix=document.createElement("div");fix.className="match-fix";
        fix.textContent=`Correct: ${letterFor(cp)}. ${p.right}`;
        row.querySelector(".match-main").appendChild(fix);
      }
    }
    selects.push(s);
    colA.appendChild(row);
  });
  grid.appendChild(colA);grid.appendChild(colB);
  answersWrap.appendChild(hint);answersWrap.appendChild(grid);

  if(!rec){
    const submit=document.createElement("button");
    submit.type="button";submit.className="nav-btn primary match-submit";submit.textContent="Check Matches";
    const sync=()=>{
      const d=state.draft[q.id];
      selects.forEach((s,j)=>{
        Array.from(s.options).forEach(o=>{
          const v=+o.value;
          o.disabled=v>=0&&d.some((x,k)=>k!==j&&x===v);
        });
      });
      submit.disabled=d.some(x=>x<0);
    };
    selects.forEach((s,j)=>s.addEventListener("change",()=>{state.draft[q.id][j]=+s.value;sync();}));
    submit.addEventListener("click",()=>submitMatching(q));
    answersWrap.appendChild(submit);
    sync();
  }
}

function submitMatching(q){
  if(state.answers[q.id])return;
  const d=state.draft[q.id];
  if(!d||d.some(x=>x<0))return;
  let points=0;
  d.forEach((pos,j)=>{if(q.order[pos]===j)points++;});
  state.answers[q.id]={selected:d.slice(),points:points,max:q.pairs.length,correct:points===q.pairs.length};
  renderQuestion();
}

function showFeedback(q,rec){
  const good=rec.correct;
  let msg;
  if(q.type==="matching")msg=good?`Correct! ${rec.points} / ${rec.max} matches`:`${rec.points} / ${rec.max} matches correct`;
  else msg=good?"Correct!":`Incorrect — correct answer: ${esc(q.answer)}`;
  feedbackWrap.innerHTML=`<div class="feedback-line ${good?"good":"bad"}"><span aria-hidden="true">${good?"✓":"✕"}</span><span>${msg}</span></div>`;
  if(q.explanation){
    explainWrap.innerHTML=`<div class="explanation"><strong><span aria-hidden="true">💡</span> Explanation</strong>${esc(q.explanation)}</div>`;
  }
}

function selectAnswer(q,opt){
  if(state.answers[q.id])return;
  const ok=opt===q.answer;
  state.answers[q.id]={selected:opt,points:ok?1:0,max:1,correct:ok};
  renderQuestion();
}

function nextQuestion(){
  if(state.index<state.list.length-1){state.index++;renderQuestion();}
  else showResults();
}
function previousQuestion(){
  if(state.index>0){state.index--;renderQuestion();}
}

/* ================= RESULTS & REVIEW ================= */
function showResults(){
  showOnly(resultsScreen);
  const total=totalPoints(),got=earnedPoints();
  resultsScore.textContent=`${got} / ${total}`;
  resultsPct.textContent=`${Math.round((got/total)*100)}% correct · ${state.list.length} questions`;
  statCorrect.textContent=got;
  statIncorrect.textContent=total-got;
  statTotal.textContent=total;
}

function showReview(){
  showOnly(reviewScreen);
  reviewList.innerHTML="";
  const wrong=state.list.filter(q=>{const r=state.answers[q.id];return r&&!r.correct;});
  if(!wrong.length){
    reviewList.innerHTML=`<div class="empty-review">You answered every question correctly. Nothing to review!</div>`;
    return;
  }
  wrong.forEach(q=>{
    const rec=state.answers[q.id];
    const card=document.createElement("div");card.className="review-card";
    let html=`<div class="review-q">${esc(q.question)}</div>`;
    if(q.type==="matching"){
      html+=`<div class="review-row"><b>Score:</b> ${rec.points} / ${rec.max}</div>`;
      q.pairs.forEach((p,j)=>{
        const ok=q.order[rec.selected[j]]===j;
        const mine=q.pairs[q.order[rec.selected[j]]].right;
        html+=`<div class="review-row ${ok?"right":"wrong"}"><b>${j+1}. ${esc(p.left)}</b><br>Your Match: ${esc(mine)}${ok?"":`<br>Correct Match: ${esc(p.right)}`}</div>`;
      });
    }else{
      html+=`<div class="review-row wrong"><b>Your Answer:</b> ${esc(rec.selected)}</div><div class="review-row right"><b>Correct Answer:</b> ${esc(q.answer)}</div>`;
      if(q.explanation)html+=`<div class="review-explain">${esc(q.explanation)}</div>`;
    }
    card.innerHTML=html;
    reviewList.appendChild(card);
  });
}

function retakeQuiz(){
  buildAttempt(state.module);
  showOnly(quizShell);
  renderQuestion();
}

/* ================= WIRING ================= */
prevBtn.addEventListener("click",previousQuestion);
nextBtn.addEventListener("click",nextQuestion);
$("reviewBtn").addEventListener("click",showReview);
$("retakeBtn").addEventListener("click",retakeQuiz);
$("modulesBtn").addEventListener("click",goModules);
$("resultsModulesBtn").addEventListener("click",goModules);
$("backFromReview").addEventListener("click",()=>{showOnly(resultsScreen);});

renderModules();
})();
</script>
</body>
</html>
